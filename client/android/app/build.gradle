apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()

    /* Bundling: when `bundleInDebug=true` (gradle.properties), embed the JS bundle into the
     * debug APK too. The RN plugin skips bundling for any variant listed in `debuggableVariants`
     * (default ["debug"]); clearing it makes the debug build bundle JS so the app runs standalone
     * without a Metro dev server — required for on-device field testing over Tor. */
    if ((findProperty('bundleInDebug') ?: 'false').toBoolean()) {
        debuggableVariants = []
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.stiq.client"
    defaultConfig {
        applicationId "com.stiq.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump BOTH on every fleet-distributed build: versionCode gates upgrades (adb/package
        // installer refuses downgrades; the T9-S6 in-app update repo offers an update only when the
        // repo's versionCode is higher) and versionName is the only thing a user can read back to us
        // from Settings → Apps → STIQ, so it is the fleet's version beacon. Every build before
        // 2026-07-23 shipped as 1.0/1 — indistinguishable in the field, which is how the fleet
        // silently drifted onto months-stale APKs.
        // ⚠ STILL A TEST BUILD, not a fleet release — but it is a DIFFERENT build from vc9, and a
        // tester who cannot tell the two apart cannot report a useful result. vc7 was the first
        // C-tor-free APK; vc9 added the reconnect fix (a second startTor in one process used to fail
        // forever), onion-service PoW, the snowflake/webtunnel/meek binaries, and 16 KB alignment.
        // vc10 is the first build on arti-client 0.44 (Arti 2.5.0, up from 0.28/Arti 1.4.1) with
        // congestion control and CGO on, the first with R8 full mode, and the first where the
        // reachability probe actually reaches the native layer for PUBLIC communities — the JS and
        // Rust halves of that had shipped in vc9 but StiqArtiModule.buildConfigJson dropped
        // `relayOnion` in between, so the fix was inert. Also carries FLAG_SECURE app-wide and the
        // invite-link key-injection fix. Bumping both fields is what makes "which build are you on?"
        // answerable from Settings → Apps → STIQ.
        // vc11 (1.8-audit): adds Snowflake as the last rung of the DEFAULT "Automatic" ladder (it was
        // only reachable via Censored/Max-reachability before, so the default cascade could exhaust
        // without ever trying the transport built for a fully-bridge-blocked network); honors a
        // caller-supplied dataDir across the JNI boundary (a surviving relayOnion-class drop); and
        // fixes a mid-onboarding preset race where a preset picked before enrollment could be ignored
        // on the next cold start. Probe-retry + rustls-provider .so from vc10 is reused unchanged.
        // vc12 (1.9-nnew): NEW .so — the SOCKS connect phase now has a 120s ceiling (arti's PoW
        // solve() is the one internally-unbounded step; a device that can't solve a puzzle used to
        // look frozen instead of failing retryable). Plus the per-space "N new" count on the
        // return-to-latest button in channels/groups/DMs — the last snappiness-goal polish item.
        // vc13 (2.0-fastpath): NEW .so — the reachability probe no longer BLOCKS `connected` (it
        // was 6-16s on every launch); it runs post-connect and answers `verified`/`transport-dead`,
        // with the ladder condemning dead rungs per-session instead of re-walking them. New
        // `installReach` installs onion-auth credentials into the LIVE client, which legalizes
        // starting Tor before runtime.init finishes (the measured 5.4s JS serialization). Bridge
        // fetch races moat-direct/moat-fronted/GitHub (0s/2s/4s staggers) instead of a serial
        // 40-50s worst case.
        // vc14 (2.1-backfill): SAME .so as vc13 (JS-only change). An opened channel/group's scoped
        // sub now always carries a newest-first bounded page alongside its incremental `since` tail
        // (buildOpenChatFilters): the standing channels sub's shared limit page (and the retention
        // prune) cache newest-only strays, so the since-only resub pinned itself above a hole it
        // could never refetch — after the CBT outage that read as "posts inside channels are not
        // loading for some channels while loading for others."
        // vc15 (2.2-keyheal): SAME .so as vc13/vc14 (JS-only again). Closes two OPEN_ITEMS:
        // (1) sticky per-community enforcement flags — a failed or block-less NIP-11 fetch can no
        //     longer downgrade a token-enforcing community to "tokens not required" and send
        //     token-less space writes (the confirmed "out of tokens while quota was fine" enabler);
        // (2) space-key redelivery — a member stranded keyless in a private space publishes a
        //     kind-30078 `space-key-request:` doc and any keyed admin opening the space re-delivers
        //     the current-epoch 30079 (bypassing the delivered-watermark); opening a group also
        //     re-fetches its 30079s `#h`-scoped, healing since-poisoned key subs.
        // vc16 (2.3-embedfresh): SAME .so as vc13-vc15 (JS-only again). Embed/notification
        // freshness batch: getEvent folds channel/group edits (embed preview can no longer disagree
        // with its destination), decrypts space-sealed bodies with the held key and never renders
        // NIP-44 ciphertext; comment embeds fetch their missing thread root; raw kind:pk:d
        // coordinates resolve+fetch; fetchEventDoc un-blacklists on timeout ("Fetching event…"
        // no longer strands for the session); a tapped-but-uncached embed completes its navigation
        // when the fetch lands (was a silent dead tap); edits never re-notify or outrank newer
        // broadcasts in the notification centre, live push, or headless sync.
        // vc17 (2.4-parity): SAME arti .so as vc13-vc16. Two changes:
        // (1) merges master's UX features into this line so the two transports ship the same
        //     app — the swipe-right-to-go-back gesture on every pushed page (SwipeBack engine;
        //     swipe-to-reply moved to the left) and the just-joined-space-surfaces-at-the-top
        //     Spaces fix. Master's own stamp for that feature set was vc10 "1.6-swipeback".
        // (2) first build of the TWO-APK system: the `tor` flavor dimension below emits a
        //     feature-identical arti + ctor APK pair per release; versionName gains the flavor
        //     suffix, so the field beacon reads "2.4-parity-arti" / "2.4-parity-ctor".
        // (3) gradient edits finally PROPAGATE: a new standing `identity-beacons` sub pulls the
        //     kind-30078 d="identity" carrier every edit has always published (nothing ever
        //     subscribed to it — peers only learned a new gradient off the editor's next post),
        //     the header/compose avatars read the runtime's own store instead of a feed-derived
        //     value that went stale for zero-post viewers, and an announce swallowed while the
        //     key was locked is retried on the next unlock.
        // vc18 "2.5-moderation": the member roll + the 2026-07-29 moderation audit.
        // (1) member-roll enforcement — the organizer publishes the relay's authoritative
        //     bound-npub set as an encrypted kind-30078 doc, and a blind post whose attribution
        //     resolves OFF that roll is hidden and untallied exactly like an unattributed one.
        //     Closes rotate-to-a-fresh-npub ban evasion, and a live sock-puppet vote-inflation
        //     bug with it. Deferral is the safety property: no roll loaded ⇒ zero enforcement.
        // (2) threads now enforce what the feed always did — bans, standing log-user rules, and
        //     every id of a log-batch rather than just the first (audit D1); mod-log rows name the
        //     real author of blind content instead of the throwaway signer (D2); and the
        //     organizer's reportThreshold actually suppresses, restorably (D3).
        // (3) moderator quick actions pre-check scope and rate cap instead of firing into a relay
        //     rejection, and headless background syncs refresh org config so a phone that only
        //     ever background-syncs stops honouring a REVOKED moderator.
        // vc19 "2.6-consent": consent, screenshots, and the first 16 KB-page work.
        // (1) Tapping a space link no longer joins you. Both entry points — the external
        //     stiq://channel/<id> deep link and an invite card tapped inside a message — used to
        //     reach acceptInviteLink() fire-and-forget, publishing a SIGNED kind-9021 join request
        //     under the user's identity with no prompt. Both now show what you are about to join
        //     and require an explicit confirmation; BACK and cancel decline.
        // (2) FLAG_SECURE is GONE (it was added app-wide in vc18). Screenshots, screen recording,
        //     and a real Recents/task-switcher thumbnail all work again, everywhere, by operator
        //     directive. setHideOverlayWindows(true) — anti-tapjacking, a different attack — stays.
        //     The dead StiqScreenGuard JS bridge went with it: leaving a callable setSecure(true)
        //     around is precisely how the ban would silently return.
        // (3) 16 KB page-size readiness, the part achievable without a React Native upgrade:
        //     libreanimated / libworklets / libop-sqlite are compiled by OUR build, so the root
        //     project now injects -Wl,-z,max-page-size=16384 into every CMake module; libcrsqlite
        //     and libsqlite_vec are prebuilts for op-sqlite features this app never enabled and are
        //     now excluded from packaging outright (also a smaller APK). That takes 5 of the 16
        //     misaligned arm64 libs. The other 11 are prebuilt inside React Native's own AARs,
        //     Fresco, ACINQ secp256k1, and op-sqlite's bundled OpenSSL — they need the RN 0.77+
        //     bump, which is staged on claude/rn-16kb and deliberately NOT in this release: it
        //     migrates 75 members' SQLCipher databases, and no identity backup exists yet.
        //     No shipping consumer device defaults to 16 KB pages today, so this is readiness.
        versionCode 19
        versionName "2.6-consent"

        /* RN developer support (red box, dev menu, HMR, and the Metro dev-server websocket).
         *
         * MainApplication used to tie this to BuildConfig.DEBUG, but our debug APK is a FIELD build:
         * `bundleInDebug=true` embeds the JS bundle, so there is no Metro dev server to talk to and
         * the dev client just retries localhost:8081 every 2s forever, burning CPU and battery on
         * the phones we actually test on.
         *
         * Default: the inverse of bundleInDebug — an embedded bundle means no dev server, so no dev
         * support. A dev running Metro (bundleInDebug=false) still gets the full dev experience with
         * no flags. Override either way with -PdevSupport=true|false. */
        def devSupportDefault = !((findProperty('bundleInDebug') ?: 'false').toBoolean())
        def devSupport = (findProperty('devSupport') ?: devSupportDefault.toString()).toBoolean()
        buildConfigField "boolean", "DEV_SUPPORT", devSupport.toString()
    }

    // ONE app, TWO Tor engines. Every release ships as a PAIR of feature-identical APKs that
    // differ ONLY in the embedded Tor implementation:
    //   arti — the Rust arti-client engine: StiqArtiModule + libarti_mobile.so, with pluggable
    //          transports spawned as external processes from this flavor's jniLibs
    //          (libLyrebird/libSnowflake/libWebtunnel; extraction relies on useLegacyPackaging).
    //   ctor — the classic C-tor engine: StiqTorModule driving info.guardianproject:tor-android,
    //          with pluggable transports in-process via IPtProxy's gomobile bundle.
    // Same applicationId + same signing in both flavors: a device crossgrades between engines
    // without losing enrollment (versionCode gates the direction; equal codes reinstall with -r).
    // versionNameSuffix is the only user-visible marker — Settings → Apps → STIQ reads e.g.
    // "2.4-parity-arti" vs "2.4-parity-ctor", which keeps "which build are you on?" answerable
    // per ENGINE, not just per release.
    // The JS bundle is IDENTICAL in both flavors: createTorBackend() probes which engine module
    // (StiqArti / StiqTor) the build linked; MainApplication registers the engine through each
    // flavor's own TorEnginePackages source file. Never put engine-specific Kotlin in src/main —
    // it must live in src/arti or src/ctor so the other flavor cannot compile against it.
    flavorDimensions 'tor'
    productFlavors {
        arti {
            dimension 'tor'
            versionNameSuffix '-arti'
        }
        ctor {
            dimension 'tor'
            versionNameSuffix '-ctor'
            // R8 keeps for the reflection/JNI surfaces of tor-android + IPtProxy — only this
            // flavor has those classes on its classpath, so the keeps live in a flavor file
            // instead of proguard-rules.pro.
            proguardFile 'proguard-ctor.pro'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Internal distribution: the release APK is sideloaded onto test phones over Tor, not
            // shipped through Play, so it is signed with the SAME debug keystore as the debug build.
            // This is deliberate — without a signingConfig the release APK is unsigned and the phone
            // refuses to install it. Swap in a dedicated upload/release keystore before any public
            // Play Store distribution (see https://reactnative.dev/docs/signed-apk-android); until
            // then debug signing keeps the "install the release APK on the device" path working.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // Strip unused resources (drawables/layouts/strings) from androidx (webkit/biometric/
            // work-runtime/localbroadcastmanager), RN, svg and webview. Piggybacks on the code
            // shrinking already enabled above; only runs on release, so dev/debug builds are
            // untouched. See proguard-rules.pro for the reflection/JNI keeps R8 can't infer.
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Per-ABI APK splits: instead of one universal APK carrying every ABI's copy of the (heavy) Tor,
    // IPtProxy, SQLCipher/OpenSSL, Hermes and RN native libraries, emit a slim APK per ABI so a device
    // downloads only the .so it can actually run. Distribute app-arm64-v8a-<variant>.apk to modern
    // phones (arm64) — it is a fraction of the universal APK's native payload. universalApk stays true
    // so the all-ABI app-<variant>.apk still exists for convenience/CI and matches older docs.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    packaging {
        jniLibs {
            // TRUE, and now stated rather than assumed.
            //
            // Two reasons, and the second one is a correctness requirement:
            //
            //  1. Download size. Legacy packaging stores the native libs COMPRESSED in the APK, and
            //     this app is sideloaded over Tor where download bytes are the expensive resource.
            //     The cost it trades for is a one-time extraction of single-digit seconds at
            //     install, dwarfed by the 30-90 s Tor bootstrap.
            //
            //  2. ⚠ The obfs4 pluggable transport CANNOT WORK WITHOUT IT. Arti's tor-ptmgr spawns
            //     lyrebird as an external PROCESS, and since API 29 the only exec-capable directory
            //     is nativeLibraryDir — which contains real files only when the installer extracts
            //     them. With useLegacyPackaging=false the libs stay mmap'd inside the APK, so
            //     libLyrebird.so is not a file anything can execute, and every bridge rung fails.
            //
            // This used to be a comment saying the DEFAULT already gave us legacy packaging. AGP's
            // default for minSdk >= 23 is the opposite, and nothing here would have failed loudly if
            // the assumption were wrong: the app would connect fine on the direct rung and quietly
            // lose bridges — i.e. it breaks only for users in a censored network.
            useLegacyPackaging = true

            // op-sqlite vendors PREBUILT .so for two optional extensions — CRSQLite (CRDT
            // replication) and sqlite-vec (vector search). This app enables NEITHER: client
            // package.json declares only {"op-sqlite": {"sqlcipher": true}}, so op-sqlite's own
            // build.gradle leaves useCRSQLite/useSqliteVec unset and never defines
            // OP_SQLITE_USE_CRSQLITE / OP_SQLITE_USE_SQLITE_VEC, and no STIQ source references
            // crsqlite, vec0, or loadExtension. They shipped anyway purely because they sit in a
            // conventional src/main/jniLibs sourceSet, which AGP packages unconditionally —
            // ~2 MB per ABI of dead weight in every APK.
            //
            // Excluding them also removes two of the sixteen 4 KB-aligned libraries that block
            // 16 KB-page devices, and it is the only class of that problem fixable by deletion
            // rather than by an upstream release: these are prebuilts, so the root project's
            // CMAKE_SHARED_LINKER_FLAGS injection cannot reach them.
            //
            // If a future feature ever needs CRDT sync or vector search, enable it in package.json
            // AND delete the matching exclude here — otherwise the extension would be switched on
            // while its library is stripped, and the failure surfaces only at runtime.
            excludes += ["**/libcrsqlite.so", "**/libsqlite_vec.so"]
        }
    }

    packagingOptions {
        // @op-engineering/op-sqlite (SQLCipher) bundles an OpenSSL libcrypto.so / libssl.so. This
        // pickFirst used to also resolve a merge conflict against info.guardianproject:tor-android's
        // OWN OpenSSL copy; that dependency is gone (STIQ's Tor engine is now Arti, built with
        // rustls specifically to avoid bundling a second OpenSSL — see arti-ffi/Cargo.toml), so
        // op-sqlite is the only remaining source and pickFirst is now a harmless no-op. Left in
        // place as a defensive guard rather than removed. (The blind-RSA WebCrypto is pure JS —
        // onboarding/webcryptoShim.ts — and bundles no native .so.)
        pickFirst '**/libcrypto.so'
        pickFirst '**/libssl.so'
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ── ctor flavor ONLY: the C-tor engine's dependencies. ctorImplementation scopes them out
    // of the arti flavor entirely — the arti APK carries neither libtor.so nor libgojni.so.
    //
    // Bundled Tor daemon — info.guardianproject:tor-android from gpmaven (PLAN.md §3.2).
    // STIQ invariant: bundled tor must be >= 0.4.8 for onion-service PoW puzzle solving (see
    // client/src/tor/torVersion.ts).
    // RE-VERIFY BY 2027-01-12: on 2026-07-10 the community's onions went dark for ~5 days because
    // a still-widely-deployed tor 0.4.6.10 hit its network EOL and stopped receiving a valid
    // consensus (see the stiq-tor-eol-consensus-outage handoff). This pin and
    // TOR_MIN_SUPPORTED_VERSION (client/src/tor/torVersion.ts) MUST be bumped TOGETHER whenever
    // either moves — a newer bundled daemon with a stale floor (or vice versa) silently
    // reintroduces that same outage risk. client/src/tor/torVersionPin.test.ts enforces this pin
    // stays >= TOR_MIN_SUPPORTED_VERSION.
    ctorImplementation("info.guardianproject:tor-android:0.4.8.22")

    // Pluggable transports: obfs4 + Snowflake via Controller API (Maven Central, no exec binary)
    ctorImplementation("com.netzarchitekten:IPtProxy:5.5.0")

    // androidx LocalBroadcastManager — TorService (ctor flavor) bootstrap broadcasts ride it
    // again now that the C-tor engine is back as a flavor; harmless in the arti flavor.
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")

    // WorkManager for jittered background sync (periodic wake/drain/sleep cycle)
    implementation("androidx.work:work-runtime-ktx:2.9.1")

    // UnifiedPush connector (T1) — content-free push WAKE over a self-hosted ntfy distributor +
    // Orbot. NO FCM / Google Play Services. Native-only dep (no @noble/hashes drift); every call
    // path is gated dark behind the PUSH_UNIFIEDPUSH client flag until the watcher is advertised.
    // NOTE: 2.4.0 was a non-existent pin (Maven Central jumps 2.5.0 → 3.0.0 → … → 3.3.3) AND the
    // wrong API generation — StiqUnifiedPushReceiver uses the 3.x typed callbacks
    // (connector.data.PushEndpoint / PushMessage), first shipped in connector 3.0.0.
    // Pinned to 3.0.10 (the newest 3.0.x): it carries the 3.x API AND was built with
    // kotlin-stdlib 2.0.21 → Kotlin metadata 2.0.0, which the project's Kotlin 1.9.24 compiler can
    // read. 3.1.2+ jump to Kotlin 2.2/2.3 (metadata 2.1.0+) and fail this compiler with
    // "incompatible version of Kotlin … can read versions up to 2.0.0" until the project's Kotlin
    // is bumped. Revisit when RN/AGP raises kotlinVersion (android/build.gradle).
    implementation("org.unifiedpush.android:connector:3.0.10")

    // androidx.webkit ProxyController — routes the opt-in full-page WebView through Tor's
    // HTTPTunnelPort (StiqWebProxy). Without this a WebView would use the OS network stack
    // and leak the user's real IP (PLAN.md §3.2).
    implementation("androidx.webkit:webkit:1.11.0")

    // BiometricPrompt for the password-vault unlock (StiqBiometric); BIOMETRIC_STRONG |
    // DEVICE_CREDENTIAL gives biometric with the OS PIN/pattern as the built-in fallback.
    implementation("androidx.biometric:biometric:1.1.0")

    // Native BIP-340 schnorr verify for relay-event ingest (StiqSchnorrModule): bitcoin-core
    // libsecp256k1 via ACINQ's vetted JNI bindings — NOT hand-rolled curve math. Consumed only when
    // the client flips NATIVE_SCHNORR_VERIFY (src/config.ts); the JS side (nostr/nativeVerify.ts)
    // auto-falls back to pure-JS verifyEvent when the module is absent, so builds without it stay
    // fully functional. Pinned 0.15.0: built with Kotlin 1.9.x metadata, readable by this project's
    // Kotlin 1.9.24 compiler (newer 0.16+ moves to Kotlin 2.x metadata — same trap as the
    // unifiedpush connector pin above). Revisit alongside a project Kotlin bump.
    implementation("fr.acinq.secp256k1:secp256k1-kmp-jni-android:0.15.0")

    // ProfileInstaller — REQUIRED for Baseline/Startup Profiles to do anything on THIS app's
    // distribution model. AGP embeds app/src/main/baseline-prof.txt into the APK as
    // assets/dexopt/baseline.prof regardless of this dependency, but on a Play-installed app it's
    // Play's installer that pushes the profile into ART's consumption path at install time — a
    // mechanism sideloaded APKs (this app's only distribution channel) never go through. Without
    // ProfileInstaller the embedded profile is inert cargo: it ships in the APK and nothing ever
    // reads it. ProfileInstaller is what applies it instead, from inside the app's own first-run
    // (via androidx.startup, itself pulled in transitively — no manifest edit needed), and is also
    // what a manual on-device profile-capture session (SAVE_PROFILE broadcast) talks to. Confirmed
    // absent from this app's dependency graph before this line: `./gradlew :app:dependencies
    // --configuration releaseRuntimeClasspath` had no androidx.profileinstaller entry.
    implementation("androidx.profileinstaller:profileinstaller:1.4.1")
}
