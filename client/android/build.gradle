buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
        // Guardian Project: IPtProxy pluggable transports (obfs4 + Snowflake)
        maven { url "https://raw.githubusercontent.com/guardianproject/gpmaven/master" }
        maven { url "https://guardianproject.info/maven" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// TOR-NATIVE-1 tripwire — DO NOT bump targetSdkVersion to 35+ without reading this comment first.
// (Name kept from when this guarded StiqTorService too; StiqTorService is gone — C-tor was
// replaced by Arti, which runs in-process rather than as its own foreground service — but the
// same budget still applies to StiqSyncService alone, so the guard stays.)
//
// Android 15 (API 35) introduces a hard 6h/24h timeout budget on `dataSync`-type foreground
// services (Service.onTimeout(int,int), the FGS_TIMEOUT mechanism). Critically, that enforcement
// is gated on the APP'S targetSdkVersion, not the device's OS level — API 34 only added a timeout
// for shortService. So this app is exempt TODAY even on a phone already running Android 15/16 —
// but the instant targetSdkVersion is raised to 35+, the budget arms immediately on every device
// already in the field running 15/16, with no code change anywhere else needed to trigger it.
//
// StiqSyncService (client/android/app/src/main/java/com/stiq/client/) declares
// foregroundServiceType="dataSync" for the jittered background wake/drain/sleep sync cycle
// (offline-first drain over Tor, PLAN.md Obj. 4). The OS force-killing it after the budget
// elapses would silently abandon an in-flight drain out from under the user with no warning —
// StiqSyncService gets no special exemption from the API-35 dataSync timeout just because it
// isn't the only such service anymore.
//
// Before ever raising targetSdkVersion past 34, whoever does it MUST:
//   1. Implement Service.onTimeout(int,int) in StiqSyncService so the forced stop is handled
//      gracefully (persist state, reschedule via WorkManager, surface a user-visible
//      notification) instead of a drain just disappearing mid-cycle.
//   2. Re-verify foregroundServiceType="dataSync" is still the right type, given the new
//      timeout — an alternative type without this budget may fit better.
//   3. Only then remove or raise this guard.
//
// STIQ ships sideloaded per-ABI APKs (no Play Store target-API mandate forcing this), so the ONLY
// way this bump happens is a deliberate one-line edit to targetSdkVersion below — this check makes
// that edit fail the build loudly instead of shipping a landmine that only detonates once a real
// user's device has run the sync service long enough to hit the budget.
if (rootProject.ext.targetSdkVersion >= 35) {
    throw new GradleException(
        "targetSdkVersion=${rootProject.ext.targetSdkVersion} is BLOCKED (must stay <= 34). Android 15 (API 35) " +
        "starts enforcing a 6h/24h timeout budget on 'dataSync' foreground services " +
        "(Service.onTimeout), and that enforcement is gated on THIS APP'S targetSdkVersion, not " +
        "the device's OS version — so raising it arms the timeout immediately, even on phones " +
        "already running Android 15/16 today. StiqSyncService declares " +
        "foregroundServiceType=\"dataSync\" for its background sync cycle and would be silently " +
        "force-killed mid-drain once that budget elapses. " +
        "Do not raise targetSdkVersion until StiqSyncService implements " +
        "Service.onTimeout(int,int) (or moves off dataSync) to handle the forced stop gracefully — " +
        "see the comment directly above this check in client/android/build.gradle for the full " +
        "writeup and the required steps."
    )
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Guardian Project: IPtProxy (obfs4 + Snowflake) and tor-android — ctor flavor only,
        // but repo declarations are global; the arti flavor simply never resolves from them.
        maven { url "https://raw.githubusercontent.com/guardianproject/gpmaven/master" }
        maven { url "https://guardianproject.info/maven" }
    }
}

/*
 * 16 KB page-size readiness for every native library THIS BUILD COMPILES ITSELF.
 *
 * Android is moving from 4 KB to 16 KB memory pages. A .so whose PT_LOAD segments are aligned to
 * 0x1000 cannot be mapped by the dynamic linker on a 16 KB-page kernel, so the app fails to LOAD —
 * a device/kernel constraint that sideloading grants no exemption from. Measured on the vc18 APK,
 * 16 of 23 arm64 libs were 4 KB-aligned.
 *
 * Those 16 split into three classes, and only one is fixable here:
 *   - Compiled from source by our own externalNativeBuild (reanimated's libreanimated/libworklets,
 *     op-sqlite's libop-sqlite) — this block fixes them, at the currently pinned dependency
 *     versions. No upgrade, and specifically no reanimated 4.x / New Architecture migration, is
 *     needed to align a lib we compile ourselves.
 *   - Prebuilt for op-sqlite features this app does not enable (libcrsqlite, libsqlite_vec) —
 *     excluded from packaging outright in app/build.gradle rather than aligned.
 *   - Prebuilt inside third-party AARs (React Native's own libreactnative/libhermes/libjsi/libfbjni/
 *     libc++_shared, Fresco's three, ACINQ's libsecp256k1-jni, op-sqlite's bundled OpenSSL
 *     libcrypto) — genuinely out of reach of any flag we can set. Those need the RN 0.77+ bump; see
 *     PLAN_SIX_FIXES_2026-07-29.md.
 *
 * Applied to EVERY subproject that configures a CMake externalNativeBuild rather than to a
 * hardcoded list of module names: an autolinked Gradle project name changes whenever a dependency
 * is renamed or bumped, and a name that stops matching would silently stop applying the flag with
 * nothing failing loudly. Raising max-page-size on a native lib that did not need it is harmless
 * (it costs a little segment padding), so the broad application is the safe direction to err in.
 *
 * gradle.projectsEvaluated, NOT subprojects { afterEvaluate { } }: React Native's autolinking has
 * already evaluated some subprojects by the time this root script runs, and registering an
 * afterEvaluate callback on an already-evaluated project is a hard error
 * ("Cannot run Project.afterEvaluate(Closure) when the project is already evaluated").
 * projectsEvaluated fires exactly once, after every project is evaluated but before the task graph
 * is built — late enough that each module's own cmake.arguments are already set (so ours appends
 * last and cannot be clobbered), early enough that the CMake configure task still picks it up.
 *
 * The NDK toolchain does not discard this. android-legacy.toolchain.cmake sets
 * CMAKE_SHARED_LINKER_FLAGS via set(... CACHE STRING ...) WITHOUT force (a no-op once our -D has
 * set the cache entry), then PREPENDS its own defaults to our value rather than replacing it.
 *
 * Verify it actually took effect — do not assume:
 *   Get-ChildItem -Recurse -Filter CMakeCache.txt <module>/android/.cxx | Select-String "CMAKE_SHARED_LINKER_FLAGS"
 * and confirm the built .so with scripts/apkalign-style PT_LOAD inspection.
 */
gradle.projectsEvaluated {
    rootProject.subprojects { sub ->
        def androidExt = sub.extensions.findByName("android")
        if (androidExt?.defaultConfig?.externalNativeBuild?.cmake != null) {
            androidExt.defaultConfig.externalNativeBuild.cmake.arguments(
                "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            )
            sub.logger.lifecycle("[stiq-16k] max-page-size=16384 -> ${sub.path}")
        }
    }
}
