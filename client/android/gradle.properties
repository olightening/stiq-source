# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# Real phones are ARM only. The x86/x86_64 slices are emulator-only and were pure dead weight
# on every shipped APK — this app's native payload is heavy (bundled Tor + IPtProxy Go transports,
# op-sqlite SQLCipher + OpenSSL, Hermes, RN core, svg), and each of those .so was duplicated per ABI.
# Dropping the two emulator ABIs removes ~half the native code from the distributed APK. An emulator
# dev on x86_64 uses the documented CLI override above (or Android Studio's arm64 system image).
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Embed the JS bundle into the debug APK — no Metro dev server required.
bundleInDebug=true

# R8 full mode has been AGP's DEFAULT since 8.0 (this project is on 8.6.0 — see
# node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml) with no
# `android.enableR8.fullMode=false` anywhere in this tree to opt back into compat mode, so release
# builds have been running in full mode this whole time regardless of this line. Stated explicitly
# so it can never silently regress to compat mode if a future AGP bump/override changes that
# default, and so "are we on full mode" is answerable by reading this file instead of by knowing
# which AGP version does what by default. Full mode is more aggressive about inlining/merging
# across library boundaries — see app/proguard-rules.pro for the app-specific keep this required
# (StiqArtiModule's static-symbol JNI binding to arti-ffi).
#
# Static verification done (2026-07-27, this session, on a freshly rebuilt release APK — not just
# re-quoted from an earlier build): `./gradlew assembleRelease` → BUILD SUCCESSFUL; grep of the
# resulting classes.dex and outputs/mapping/release/mapping.txt both confirm the StiqArtiModule
# class AND all six native method names (artiStart/artiStop/artiNewIdentity/artiSetDormant/
# artiHttpPort/artiRegisterCallback) survive unrenamed — the keep rule below is doing its job.
#
# ⚠ ON-DEVICE VERIFICATION IS STILL NOT DONE. This session tried: install the just-built
# app-arm64-v8a-release.apk on R5CW41A60JP, force-stop, `adb shell am start -W
# com.stiq.client/.MainActivity`, then grep logcat for a real Tor bootstrap/UnsatisfiedLinkError —
# but that device (shared across concurrent agent sessions on this machine) dropped off `adb
# devices` mid-attempt and Windows reported every SAMSUNG ADB interface as PnP status "Unknown"
# (i.e. not a USB-debugging-authorization prompt, a real disconnect) for the ~8 minutes this
# session kept retrying. Static analysis cannot confirm JNI symbol *resolution* at runtime or that
# Tor actually bootstraps under full-mode's cross-library inlining — treat that as unverified, not
# safe-by-inference, until someone runs the four commands above end-to-end on a reachable device.
android.enableR8.fullMode=true
