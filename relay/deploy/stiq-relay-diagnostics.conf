[Service]
Environment=STIQ_RELAY_DIAGNOSTICS_ADDR=127.0.0.1:6060
Environment=STIQ_RELAY_DIAGNOSTICS=1
Environment=STIQ_RELAY_EVENT_DIAGNOSTICS=1
# REQUIRED whenever STIQ_RELAY_DIAGNOSTICS=1 is set above: the relay fails CLOSED without a
# diagnostics token — it calls log.Fatalf and exits immediately, taking down the WHOLE relay
# process (not just the diagnostics endpoint) if this is left unset or blank. Replace the placeholder
# below with a long random secret (e.g. `openssl rand -hex 32`) before enabling this drop-in.
Environment=STIQ_RELAY_DIAGNOSTICS_TOKEN=REPLACE_WITH_A_LONG_RANDOM_SECRET
StandardOutput=journal
StandardError=journal
